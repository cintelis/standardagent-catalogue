minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.4.9'
  - '@astrojs/runtime@0.1.1'
  - '@astrojs/vite-plugin-astro@0.1.2'
  - astro@7.4.11

# Wrangler deploys the built site. These two of its dependencies have install
# scripts that only check a downloaded binary. The deploy uploads static files
# and runs neither binary, so the scripts stay off.
allowBuilds:
  esbuild: false
  workerd: false
