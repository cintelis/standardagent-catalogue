[package]
name = "drawgen_core"
version = "0.1.0"
edition = "2024"
description = "The drawgen diagram builder, checker, and SVG renderer, compiled to WebAssembly for the Diagram Designer sample agent."
license = "MIT"
publish = false

[lib]
# cdylib builds the .wasm file. rlib lets `cargo test` run the same code natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Reads the diagram spec and writes the result. The only dependency.
serde_json = "1.0.154"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
