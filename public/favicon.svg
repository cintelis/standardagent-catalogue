<!--
  The Standard Agent Catalogue logo: three packages and one agent.
  The squares are packages on a shelf. The green circle is the one that is an
  agent. The dark tile behind them keeps the logo readable on a light or a dark
  browser tab, so the file needs no style of its own.
  src/layouts/Base.astro draws the same four shapes beside the site's name, and
  scripts/make-favicon.py draws them into favicon.ico.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0d1117" />
  <rect x="5.5" y="5.5" width="9" height="9" rx="2.2" fill="#f0f6fc" />
  <rect x="17.5" y="5.5" width="9" height="9" rx="2.2" fill="#f0f6fc" />
  <rect x="5.5" y="17.5" width="9" height="9" rx="2.2" fill="#f0f6fc" />
  <circle cx="22" cy="22" r="4.5" fill="#3fb950" />
</svg>
